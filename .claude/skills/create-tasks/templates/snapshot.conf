# What ./cks saves for /grade right before the cluster is destroyed (lab/snapshot.sh).
# namespaces: every namespace the task uses (comma- or space-separated)
# node_files: <node>:<absolute path> for files the rubric checks, beyond the defaults
#             (kube-apiserver manifest and both kubelet configs are always saved).
#             Key material (*/pki/*, *.key, *.pem) is never saved.
namespaces={{NAMESPACES}}
node_files={{NODE_FILES}}
