# kind cluster for the CKS lab (created by ./cks inside the cks-toolbox container).
#
# Local-only by construction. ./cks verify-local checks all of this and fails closed:
#   - the API server is published on 127.0.0.1 only
#   - no extra port mappings, no host mounts
#   - nodes are reachable only on the "kind" network inside the Podman VM
#
# The node image (cks-node:<hash>) is passed by ./cks via --image, so it stays pinned in lab/node/Dockerfile.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cks
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
  - role: worker
